20" x="9.5" y="82.0391"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="398" x="120.5" y="96.4961">Advokat Terverifikasi Resmi ] &#8226; [ Anggota PERADI ] &#8226; [ &#9733; 4.9 dari 124 Klien</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="1071" y1="110.1328" y2="110.1328"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="136" x="7" y="128.0898">PROFIL &amp; PENGALAMAN</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="761" x="10" y="145.1836">Berpengalaman lebih dari 15 tahun mendampingi klien korporasi dan individu dalam penyelesaian sengketa komersial dan kontrak bisnis.</text><line style="stroke:#000000;stroke-width:1.0;" x1="8" x2="1067" y1="147.8203" y2="147.8203"/><line style="stroke:#000000;stroke-width:1.0;" x1="8" x2="8" y1="144.8203" y2="146.8203"/><line style="stroke:#000000;stroke-width:1.0;" x1="1067" x2="1067" y1="144.8203" y2="146.8203"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="1071" y1="156.3203" y2="156.3203"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="176" x="7" y="174.2773">1. PILIH LAYANAN KONSULTASI</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="406" y1="182.4141" y2="182.4141"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="238.375" x="27" y="199.3711">Konsultasi Awal (15 Menit) &#8212; GRATIS Rp 0</text><ellipse cx="14" cy="194.4609" fill="none" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="277" x="7" y="216.4648">Penilaian awal kasus hukum Anda secara singkat.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="13" x="7" y="233.5586">(*)</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="262.375" x="23" y="233.5586">Konsultasi Mendalam (45 Menit) &#8212; Rp 450.000</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="398" x="7" y="250.6523">Analisis dokumen, pembahasan strategi hukum, dan saran tindak lanjut.</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="288.375" x="27" y="267.7461">Konsultasi &amp; Pembuatan Dokumen &#8212; Rp 3.500.000</text><ellipse cx="14" cy="262.8359" fill="none" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="329" x="7" y="284.8398">Penyusunan pendapat hukum resmi / kontrak beserta revisi.</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="1071" y1="293.9766" y2="293.9766"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="232" x="7" y="311.9336">2. PILIH METODE &amp; JADWAL PERTEMUAN</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="243" y1="320.0703" y2="320.0703"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224" x="7" y="337.0273">Metode Pertemuan: (*) Konsultasi Online</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125" x="264" y="337.0273">Konsultasi Tatap Muka</text><ellipse cx="251" cy="332.1172" fill="none" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235" x="7" y="354.1211">Tanggal Konsultasi: ^Hari Ini, 10 Juli 2026^</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120" x="7" y="371.2148">Pilihan Jam Tersedia:</text><rect