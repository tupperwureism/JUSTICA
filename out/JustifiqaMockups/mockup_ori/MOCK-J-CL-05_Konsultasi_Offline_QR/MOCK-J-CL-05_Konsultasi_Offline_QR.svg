ll="#0000FF" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="104" x="379" y="200.4648">PERHATIAN KLIEN:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="274" x="373" y="217.5586">Pemindaian QR Check-out merupakan konfirmasi</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="257" x="373" y="234.6523">resmi bahwa sesi konsultasi telah selesai dan</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="267" x="373" y="251.7461">mengizinkan pencairan dana Escrow ke advokat.</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="373" x2="663" y1="259.8828" y2="259.8828"/><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="260" x="375.5" y="266.8828"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="194" x="408.5" y="281.3398">PINDAI QR CHECK-OUT SEKARANG</text><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="284" x="375.5" y="292.9766"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185" x="425" y="307.4336">Laporan Masalah / Sengketa Sesi</text><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="927" y1="5" y2="5"/><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="927" y1="317.5703" y2="317.5703"/><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="5" y1="5" y2="22.0938"/><line style="stroke:#000000;stroke-width:1.0;" x1="927" x2="927" y1="5" y2="22.0938"/><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="5" y1="151.9141" y2="159.9141"/><line style="stroke:#000000;stroke-width:1.0;" x1="927" x2="927" y1="151.9141" y2="159.9141"/><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="5" y1="69.5391" y2="77.5391"/><line style="stroke:#00