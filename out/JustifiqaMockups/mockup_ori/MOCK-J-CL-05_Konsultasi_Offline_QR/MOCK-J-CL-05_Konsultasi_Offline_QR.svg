<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="324px" preserveAspectRatio="none" style="width:934px;height:324px;background:#FFFFFF;" version="1.1" viewBox="0 0 934 324" width="934px" zoomAndPan="magnify"><defs/><g><rect fill="#DDDDDD" height="16.0938" style="stroke:#000000;stroke-width:1.0;" width="921" x="6" y="6"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="49" x="6" y="18.457">JUSTICA</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="162" x="58" y="18.457">- Check-in Tatap Muka Resmi</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="83" x="230" y="18.457">[ Dasbor Saya ]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="38" x="323" y="18.457">[ &#9728; / &#9790; ]</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="927" y1="26.5938" y2="26.5938"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="523" x="7" y="45.5889">HANDSHAKE KONSULTASI OFFLINE TATAP MUKA BER-QR (DUAL QR HANDSHAKE)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="672" x="10" y="62.9023">Pastikan Anda melakukan pemindaian QR Check-in &amp; Check-out resmi di kantor advokat untuk perlindungan dana Escrow.</text><line style="stroke:#000000;stroke-width:1.0;" x1="8" x2="923" y1="65.5391" y2="65.5391"/><line style="stroke:#000000;stroke-width:1.0;" x1="8" x2="8" y1="62.5391" y2="64.5391"/><line style="stroke:#000000;stroke-width:1.0;" x1="923" x2="923" y1="62.5391" y2="64.5391"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="927" y1="74.0391" y2="74.0391"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="151" x="8" y="92.9961">Informasi Sesi Tatap Muka</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="291" x="253" y="92.9961">Status Dual QR Handshake &amp; Timer Sesi (ST-J-08B)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201" x="9" y="111.0898">Advokat: Dr. Mahendra Kusuma, S.H.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241" x="9" y="128.1836">Lokasi: Kantor Hukum Mahendra &amp; Partners</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144" x="9" y="145.2773">Durasi Slot Baku: 60 Menit</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="117" x="254" y="111.0898">Dual QR Handshake:</text><text fill="#008000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="182" x="374" y="111.0898">CHECK-IN BERHASIL (14:02 WIB)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137" x="254" y="128.1836">Standard Session Timer:</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="133" x="394" y="128.1836">Sisa 48:15 / 60:00 Menit</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="176" x="254" y="145.2773">Systemic Auto Check-out Guard:</text><text fill="#FFA500" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="170" x="433" y="145.2773">Batas Maks 120m (16:02 WIB)</text><line style="stroke:#000000;stroke-width:1.0;" x1="7" x2="252" y1="79.5391" y2="79.5391"/><line style="stroke:#000000;stroke-width:1.0;" x1="252" x2="605" y1="96.6328" y2="96.6328"/><line style="stroke:#000000;stroke-wi