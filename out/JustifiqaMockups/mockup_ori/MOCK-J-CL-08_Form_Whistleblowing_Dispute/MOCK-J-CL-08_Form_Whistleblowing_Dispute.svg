<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="406px" preserveAspectRatio="none" style="width:1525px;height:406px;background:#FFFFFF;" version="1.1" viewBox="0 0 1525 406" width="1525px" zoomAndPan="magnify"><defs/><g><rect fill="#DDDDDD" height="16.0938" style="stroke:#000000;stroke-width:1.0;" width="1507" x="6" y="6"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="49" x="6" y="18.457">JUSTICA</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192" x="58" y="18.457">- Pusat Sengketa &amp; Whistleblowing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="83" x="260" y="18.457">[ Dasbor Saya ]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="68" x="353" y="18.457">[ &lt; Kembali ]</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="38" x="431" y="18.457">[ &#9728; / &#9790; ]</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="1513" y1="26.5938" y2="26.5938"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="463" x="7" y="45.5889">FORMULIR PELAPORAN SENGKETA LAYANAN &amp; WHISTLEBLOWING ETIK</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="669" x="10" y="62.9023">Pelaporan Anda akan membekukan penarikan dana Escrow advokat secara otomatis sampai investigasi mediasi selesai.</text><line style="stroke:#000000;stroke-width:1.0;" x1="8" x2="907" y1="65.5391" y2="65.5391"/><line style="stroke:#000000;stroke-width:1.0;" x1="8" x2="8" y1="62.5391" y2="64.5391"/><line style="stroke:#000000;stroke-width:1.0;" x1="907" x2="907" y1="62.5391" y2="64.5391"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="1513" y1="74.0391" y2="74.0391"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="252" x="7" y="91.9961">1. PILIH SESI / PERKARA YANG BERMASALAH</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="958" y1="100.1328" y2="100.1328"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111" x="7" y="117.0898">Sesi Perkara Terkait</text><rect fill="#EEEEEE" height="18.0938" style="stroke:#000000;stroke-width:1.0;" width="551" x="959" y="104.6328"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="10" x="961" y="119.0898">1.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="398" x="974" y="119.0898">REQ-202607-001 &#8212; Dr. Mahendra Kusuma, S.H. (Hukum Bisnis - Tier 2)</text><line style="stroke:#000000;stroke-width:1.0;" x1="1499" x2="1499" y1="104.6328" y2="122.7266"/><polygon fill="#000000" points="1502,110.6328,1508,110.6328,1505,117.7266" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112" x="7" y="138.1836">Status Dana Escrow</text><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="316" x="961.5" y="128.2266"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="252.375" x="993.3125" y="142.6836">ESCROW HELD &#8212; SIAP DIBEKUKAN (FREEZE)</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="958" y1="155.3203" y2="155.3203"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="317" x="7" y="172.2773">2. KATEGORI LAPORAN SENGKETA / PELANGGARAN ETIK</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="340" x="27" y="189.3711">Advokat Tidak Hadir / Tidak Responsif Melebihi SLA Fair-Clock</text><ellipse cx="14" cy="184.4609" fill="none" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="388" x="7" y="206.4648">(*) Kualitas Deliverable Tidak Sesuai Spesifikasi / Hukum yang Berlaku</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="362" x="27" y="223.5586">Pelanggaran Kode Etik Advokat / Permintaan Biaya di Luar Escrow</text><ellipse cx="14" cy="218.6484" fill="none" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="311" x="27" y="240.6523">Dugaan Konflik Kepentingan / Pelanggaran Kerahasiaan</text><ellipse cx="14" cy="235.7422" fill="none" rx="5" ry="5" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="958" y1="248.7891" y2="248.7891"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="385" x="7" y="265.7461">3. KRONOLOGI &amp; BUKTI PENDUKUNG (IMMUTABLE WORM EVIDENCE)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147" x="7" y="282.8398">Uraian Kejadian Sengketa:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="686" x="10" y="299.9336">Advokat tidak merespons revisi perjanjian selama 48 jam dan dokumen yang dikirimkan keliru mencantumkan pasal UU PT...</text><line style="stroke:#000000;stroke-width:1.0;" x1="8" x2="955" y1="302.5703" y2="302.5703"/><line style="stroke:#000000;stroke-width:1.0;" x1="8" x2="8" y1="299.5703" y2="301.5703"/><line style="stroke:#000000;stroke-width:1.0;" x1="955" x2="955" y1="299.5703" y2="301.5703"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="958" y1="310.0703" y2="310.0703"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="306" x="7" y="327.0273">Unggah Bukti Pendukung (Tangkapan Layar/Dokumen):</text><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="292" x="961.5" y="317.0703"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194" x="1010.5" y="331.5273">Pilih Berkas PDF/JPG (Max 15MB)...</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="958" y1="344.1641" y2="344.1641"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="689" x="27" y="361.1211">Saya menyatakan laporan ini benar dan menyetujui penahanan sementara dana Escrow selama investigasi etik berlangsung.</text><rect fill="none" height="10" style="stroke:#000000;stroke-width:1.5;" width="10" x="9" y="351.2109"/><polygon fill="#000000" points="10,354.6641,13,357.6641,20,348.6641,13,355.6641" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="958" y1="369.2578" y2="369.2578"/><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="348" x="9.5" y="376.2578"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="282" x="42.5" y="390.7148">KIRIM LAPORAN &amp; BEKUKAN ESCROW SEKARANG</text><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="60" x="961.5" y="376.2578"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="28" x="977.5" y="390.7148">Batal</text><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="1513" y1="5" y2="5"/><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="1513" y1="399.8516" y2="399.8516"/><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="5" y1="5" y2="