yle="stroke:#000000;stroke-width:1.0;" x1="8" x2="8" y1="62.5391" y2="64.5391"/><line style="stroke:#000000;stroke-width:1.0;" x1="931" x2="931" y1="62.5391" y2="64.5391"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="1049" y1="74.0391" y2="74.0391"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="191" x="8" y="92.9961">Informasi Advokat &amp; Tier Layanan</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="161" x="218" y="92.9961">Status Enkripsi &amp; Kunci Sesi</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="158" x="445" y="92.9961">Waktu Tersedia (Fair-Clock)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183" x="9" y="111.0898">Dr. Mahendra Kusuma, S.H., M.H.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158" x="9" y="128.1836">SIPP MA: ACTIVE (VERIFIED)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="74" x="9" y="145.2773">Tier Layanan:</text><text fill="#0000FF" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="129" x="86" y="145.2773">TIER 2 (45 MENIT E2EE)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186" x="219" y="111.0898">Fingerprint Kunci: `8F:90:A2:C4:...`</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="97" x="219" y="128.1836">Inline DLP Guard:</text><text fill="#008000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="123" x="319" y="128.1836">ACTIVE (~30ms Scan)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="65" x="446" y="111.0898">Sisa Waktu:</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="105" x="514" y="111.0898">44:12 / 45:00 Menit</text><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="276" x="448.5" y="118.2266"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="203" x="485" y="132.6836">MINTA JEDA WAKTU (PAUSE TIMER)</text><line style="stroke:#000000;stroke-width:1.0;" x1="7" x2="217" y1="79.5391" y2="79.5391"/><line style="stroke:#000000;stroke-width:1.0;" x1="444" x2="729" y1="149.9141" y2="149.9141"/><line style="stroke:#000000;stroke-width:1.0;" x1="217" x2="444" y1="96.6328" y2="96.6328"/><line style="stroke:#000000;stroke-width:1.0;" x1="217" x2="444" y1="79.5391" y2="79.5391"/><line style="stroke:#000000;stroke-width:1.0;" x1="444" x2="729" y1="96.6328" y2="96.6328"/><line style="stroke:#000000;stroke-width:1.0;" x1="444" x2="729" y1="79.5391" y2="79.5391"/><line style="stroke:#000000;stroke-width:1.0;" x1="7" x2="217" y1="149.9141" y2="149.9141"/><line style="stroke:#000000;stroke-width:1.0;" x1="217" x2="444" y1="149.9141" y2="149.9141"/><line style="stroke:#000000;stroke-width:1.0;" x1="7" x2="217" y1="96.6328" y2="96.6328"/><line style="stroke:#000000;stroke-width:1.0;" x1="7" x2="7" y1="79.5391" y2="96.6328"/><line style="stroke:#000000;stroke-width:1.0;" x1="217" x2="217" y1="96.6328" y2="149.9141"/><line style="stroke:#000000;stroke-width:1.0;" x1="217" x2="217" y1="79.5391" y2="96.6328"/><line style="stroke:#000000;stroke-width:1.0;" x1="444" x2="444" y1="96.6328" y2="149.9141"/><line style="stroke:#000000;stroke-width:1.0;" x1="729" x2="729" y1="96.6328" y2="149.9141"/><line style="stroke:#000000;stroke-width:1.0;" x1="444" x2="444" y1="79.5391" y2="96.6328"/><line style="stroke:#000000;stroke-width:1.0;" x1="729" x2="729" y1="79.5391" y2="96.6328"/><line style="stroke:#000000;stroke-width:1.0;" x1="7" x2="7" y1="96.6328" y2="149.9141"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="1049" y1="156.4141" y2="156.4141"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="334" x="7" y="174.3711">RIWAYAT OBROLAN E2EE &amp; PROTEKSI DATA PRIBADI (DLP)</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="1048" y1="182.5078" y2="182.5078"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="37" x="8" y="200.4648">[10:30]</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="31" x="48" y="200.4648">Klien:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="353" x="82" y="200.4648">Selamat pagi Pak Advokat, saya ingin konsultasi perjanjian NDA.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="37" x="8" y="217.5586">[10:31]</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="79" x="48" y="217.5586">Dr. Mahendra:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="369" x="130" y="217.5586">Selamat pagi, siap. Silakan lampirkan draf klausul kerahasiaannya.</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="8" x2="1047" y1="225.6953" y2="225.6953"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3" x="8" y="242.6523">!</text><text fill="#FF0000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="276" x="14" y="242.6523">SISTEM DLP JUSTICA (BLOCKED PRIVATE DATA):</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="754" x="11" y="259.7461">Anda mencoba mengirimkan nomor kartu kredit/CVV. Demi keamanan finansial Anda, pesan ini telah disensor otomatis oleh engine DLP.</text><line style="stroke:#000000;stroke-width:1.0;" x1="9" x2="1044" y1="262.3828" y2="262.3828"/><line style="stroke:#000000;stroke-width:1.0;" x1="9" x2="9" y1="259.3828" y2="261.3828"/><line style="stroke:#000000;stroke-width:1.0;" x1="1044" x2="1044" y1="259.3828" y2="261.3828"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="1049" y1="271.8828" y2="271.8828"/><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="388" x="9.5" y="279.8828"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="308" x="49.5" y="294.3398">UNGGAH DOKUMEN BARU (PDF/DOCX MAX 15MB E2EE)</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="401" y1="306.9766" y2="306.9766"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="242" x="7" y="323.9336">Ketik pesan konsultasi hukum Anda di sini...</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145" x="405" y="323.9336">Klausul pasal 4 berbunyi...</text><line style="stroke:#000000;stroke-width:1.0;" x1="403" x2="622" y1="326.5703" y2="326.5703"/><line style="stroke:#000000;stroke-width:1.0;" x1="403" x2="403" y1="323.5703" y2="325.5703"/><line style="stroke:#000000;stroke-width:1.0;" x1="622" x2="622" y1="323.5703" y2="325.5703"/><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="164" x="9.5" y="333.0703"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="105" x="39" y="347.5273">KIRIM PESAN E2EE</text><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="204" x="404.5" y="333.0703"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132" x="440.