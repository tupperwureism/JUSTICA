E COMMAND CENTER ADVOKAT</text><rect fill="#EEEEEE" height="19.0938" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="228" x="425.5" y="218.6016"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="155" x="462" y="233.0586">Lupa PIN KMS / Kredensial?</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="1191" y1="246.6953" y2="246.6953"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3" x="7" y="264.6523">!</text><text fill="#0000FF" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="260" x="13" y="264.6523">KEPATUHAN KODE ETIK ADVOKAT INDONESIA:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="821" x="10" y="281.7461">Dengan masuk ke portal mitra, Anda terikat pada Kode Etik Advokat Indonesia dan kewajiban penjaminan kerahasiaan klien (Attorney-Client Privilege).</text><line style="stroke:#000000;stroke-width:1.0;" x1="8" x2="1187" y1="284.3828" y2="284.3828"/><line style="stroke:#000000;stroke-width:1.0;" x1="8" x2="8" y1="281.3828" y2="283.3828"/><line style="stroke:#000000;stroke-width:1.0;" x1="1187" x2="1187" y1="281.3828" y2="283.3828"/><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="1191" y1="5" y2="5"/><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="1191" y1="288.3828" y2="288.3828"/><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="5" y1="5" y2="22.0938"/><line style="stroke:#000000;stroke-width:1.0;" x1="1191" x2="1191" y1="5" y2="22.0938"/><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="5" y1="242.1953" y2="250.1953"/><line style="stroke:#000000;stroke-width:1.0;" x1="1191" x2="1191" y1="242.1953" y2="250.1953"/><line style="stroke:#000000;stroke-width:1.0;" x1="5" x2="5" y1="69.5391" y2="77.5391"/><line style="stroke:#000000;stroke-width:1.0;" x1="1191" x2="1191" y1="69.5391" y2="77.5391"/><line style="stro